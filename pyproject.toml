[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-chip-advisor"
version = "0.1.0"
description = "Evidence-bound chip Hybrid Search MVP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
]

[project.scripts]
local-chip-advisor = "local_chip_advisor.cli:cli_entrypoint"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["local_chip_advisor"]
