[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-chip-advisor"
version = "0.1.0"
description = "Offline, evidence-bound MPS Buck converter selection assistant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "chromadb>=1.5.4,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "pyyaml>=6,<7",
  "rank-bm25>=0.2.2,<1",
  "streamlit>=1.48,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["local_chip_advisor"]
